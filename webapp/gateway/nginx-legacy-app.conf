# Include inside the api.pasekaproduction.ru HTTPS server block.
# Old Telegram links must not serve HTML with asset URLs belonging to another app.
location = /yourbody-app {
    return 302 https://app.pasekaproduction.ru:9443/$is_args$args;
}

location = /yourbody-app/index.html {
    return 302 https://app.pasekaproduction.ru:9443/$is_args$args;
}

location /yourbody-app/ {
    rewrite ^/yourbody-app/(.*)$ https://app.pasekaproduction.ru:9443/$1 redirect;
}
