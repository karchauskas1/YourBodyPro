name: Application regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r webapp/backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: webapp/frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: webapp/frontend
      - run: node --test webapp/gateway/server.test.cjs
      - run: npx playwright install --with-deps chromium
        working-directory: webapp/frontend
      - run: npm run test:e2e
        working-directory: webapp/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: webapp/frontend/test-results/
          retention-days: 7
